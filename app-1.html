<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APP - HOLOLIFE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Noto+Sans+TC:wght@300;400&family=Tenor+Sans&display=swap" rel="stylesheet">
  <link href="https://fonts.cdnfonts.com/css/broadway" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root { --font-menu: 'Amarna Light', 'Nirmala UI', sans-serif; }

    html { scroll-behavior: smooth; }

    body {
      background: #F1F2F4;
      font-family: var(--font-menu);
      overflow-x: hidden;
    }

    /* ════════ NAV ════════ */
    #nav {
      position: fixed;
      top: 40px; left: 0; right: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: clamp(24px, 4vw, 32px) clamp(24px, 4vw, 56px);
      gap: clamp(24px, 6vw, 85px);
      z-index: 200;
      --nav-fg: #222;
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: clamp(16px, 2.2vw, 32px);
      flex-wrap: wrap;
      justify-content: center;
    }
    #nav a {
      font-family: var(--font-menu);
      font-size: clamp(11px, 1.1vw, 16px);
      font-weight: 400;
      letter-spacing: 0.5em;
      color: var(--nav-fg);
      text-decoration: none;
      text-transform: uppercase;
      transition: color 0.4s ease, border-color 0.4s ease, background 0.4s ease,
      box-shadow 0.4s ease, font-weight 0.2s ease;
      padding: 10px;
      position: relative;
    }
    #nav a:not(.contact)::after {
      content: '';
      position: absolute;
      bottom: 4px; left: 10px; right: 10px;
      height: 1.5px;
      background: currentColor;
      transform: scaleX(0);
      transform-origin: left center;
      transition: transform 0.3s ease, opacity 0.3s ease;
      opacity: 0;
    }
    #nav a:not(.contact):hover { font-weight: 700; }
    #nav a:not(.contact):hover::after { transform: scaleX(1); opacity: 1; }
    #nav a:not(.contact).nav-active { font-weight: 700; }
    #nav a:not(.contact).nav-active::after { transform: scaleX(1); opacity: 1; }
    #nav a.contact {
      border: none;
      background: #fff;
      padding: 10px 22px;
      border-radius: 999px;
      font-weight: 700;
      letter-spacing: 0.5em;
      color: #222;
      box-shadow: 0 2px 6px rgba(0,0,0,0.10), 0 8px 18px rgba(0,0,0,0.08);
      transition: background 0.28s ease, color 0.28s ease, box-shadow 0.28s ease, border 0.28s ease;
    }
    #nav a.contact:hover {
      background: #626262;
      color: #fff !important;
      border-radius: 24px;
      box-shadow: 1px 1px 3px 0 rgba(0,0,0,0.40) inset;
    }
    .nav-hamburger {
      display: none;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      z-index: 401;
      flex-shrink: 0;
    }
    .nav-hamburger span {
      display: block;
      width: 22px; height: 1.5px;
      background: var(--nav-fg, #222);
      border-radius: 2px;
      transition: transform 0.3s, opacity 0.3s;
      transform-origin: center;
    }
    .nav-hamburger.is-open span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
    .nav-hamburger.is-open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
    .nav-hamburger.is-open span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }
    .nav-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 350;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .nav-overlay.is-open { opacity: 1; }

    @media (max-width: 768px) {
      #nav {
        top: 0;
        padding: 14px 20px;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      .nav-hamburger { display: flex; }
      .nav-overlay { display: block; pointer-events: none; }
      .nav-overlay.is-open { pointer-events: auto; }
      .nav-links {
        position: fixed;
        top: 0; right: -100%;
        width: min(72vw, 280px);
        height: 100dvh;
        background: #F1F2F4;
        backdrop-filter: blur(20px);
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        gap: 4px;
        padding: 80px 36px 60px;
        z-index: 400;
        transition: right 0.38s cubic-bezier(0.4,0,0.2,1);
      }
      .nav-links.is-open { right: 0; }
      .nav-links a {
        font-size: 11px !important;
        letter-spacing: 0.32em;
        padding: 12px 0 !important;
        color: #3a3a4a !important;
        border-bottom: 1px solid rgba(0,0,0,0.07);
        width: 100%;
      }
      .nav-links a:last-child { border-bottom: none; }
      #nav-contact {
        background: transparent !important;
        border: 1px solid rgba(30,30,46,0.3) !important;
        border-radius: 24px !important;
        padding: 10px 18px !important;
        margin-top: 20px;
        align-self: flex-start;
      }
    }

    /* ════════ CONTENT ════════ */
    .pic-wrap {
      padding-top: clamp(100px, 14vw, 220px);
      display: flex;
      flex-direction: column;
      gap: 48px;
      padding-left: clamp(24px, 20vw, 400px);
      padding-right: clamp(24px, 20vw, 400px);
      padding-bottom: 80px;
    }

    .pic-wrap img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 4px;
    }

    @media (max-width: 480px) {
      .pic-wrap { gap: 20px; }
    }

  @media (hover: hover) and (pointer: fine) {
    body { cursor: none; }
  }
  @media (hover: none), (pointer: coarse) {
    #cursor { display: none; }
  }

#cursor {
  position: fixed;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  pointer-events: none;
  z-index: 9999;
  top: 0; left: 0;
  transform: translate(-50%, -50%);
  transition: background 0.4s ease, border-color 0.4s ease, transform 0.12s ease;
  background: rgba(200, 195, 185, 0.08);
  border: 1.5px solid rgba(200, 195, 185, 0.75);
  mix-blend-mode: difference;
}

#cursor::after {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: rgb(200, 195, 185);
  transition: background 0.4s ease;
}



  </style>
</head>
<body>
  <div id="cursor"></div>

  <!-- NAV -->
  <nav id="nav">
    <button class="nav-hamburger" id="nav-hamburger" aria-label="開啟選單" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <div class="nav-overlay" id="nav-overlay"></div>
    <div class="nav-links" id="nav-links">
      <a href="./index.html">HOME</a>
      <a href="./ui.html"class="nav-active">MOBILE</a>
      <a href="./web.html" >WEB</a>
      <a href="./illustration.html">ILLUSTRATION</a>
      <a href="./photography.html">PHOTOGRAPHY</a>
    </div>
    <a href="./contact.html" class="contact" id="nav-contact">CONTACT</a>
  </nav>

  <!-- 圖片區：左右各空 100px，上下依序排列 -->
  <div class="pic-wrap">
    <img src="./pic/6 (5).webp" alt="">
  </div>

  <script>

 
    /* ════════ NAV ════════ */
    const hamburger  = document.getElementById('nav-hamburger');
    const navDrawer  = document.getElementById('nav-links');
    const navOverlay = document.getElementById('nav-overlay');

    function openMenu() {
      hamburger.classList.add('is-open');
      navDrawer.classList.add('is-open');
      navOverlay.classList.add('is-open');
      hamburger.setAttribute('aria-expanded', 'true');
      document.body.style.overflow = 'hidden';
    }
    function closeMenu() {
      hamburger.classList.remove('is-open');
      navDrawer.classList.remove('is-open');
      navOverlay.classList.remove('is-open');
      hamburger.setAttribute('aria-expanded', 'false');
      document.body.style.overflow = '';
    }
    hamburger.addEventListener('click', () => hamburger.classList.contains('is-open') ? closeMenu() : openMenu());
    navOverlay.addEventListener('click', closeMenu);
    navDrawer.querySelectorAll('a').forEach(a => a.addEventListener('click', closeMenu));

    const navLinkEls = Array.from(document.querySelectorAll('#nav a')).filter(a => !a.classList.contains('contact'));
    navLinkEls.forEach(a => {
      a.addEventListener('click', e => {
        navLinkEls.forEach(l => l.classList.remove('nav-active'));
        a.classList.add('nav-active');
        if (a.getAttribute('href') === '#') e.preventDefault();
      });
    });

  const cursor = document.getElementById('cursor');
  if (cursor) {
    document.addEventListener('mousemove', (e) => {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top  = e.clientY + 'px';
    });
  }
  </script>
</body>


</html>
